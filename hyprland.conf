#!/usr/bin/env bash

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-4,1920x1080,1920x-540,auto,transform,1
monitor=HDMI-A-2,1920x1080,0x0,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
#exec-once = hyprpaper & waybar
exec-once = hyprpaper & quickshell
exec-once = [workspace 1 silent] vesktop --use-angle=vulkan --disable-gpu-compositing
exec-once = [workspace 2 silent] vivaldi

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = fuzzel

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = pl,ca,de
    kb_variant = ,fr, 
    kb_model =
    kb_options =grp:alt_space_toggle
    kb_rules =

    follow_mouse = 0

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 13
    border_size = 2
    col.active_border = rgba(8aadf4ee) rgba(8bd5caee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    # drop_shadow = yes
    # shadow_range = 5
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

xwayland {
		force_zero_scaling = true
}
debug {
  damage_tracking = 0  
}


animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.10, 0.9, 0.1, 1.05

    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 7, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    #pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
	new_status = slave
}


misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
		disable_hyprland_logo = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

env = GRIMBLAST_EDITOR,swappy -f

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
opengl {
    nvidia_anti_flicker = false
}

cursor {
    no_hardware_cursors = true
		enable_hyprcursor = false
}

# windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = , PRINT, exec, $(grimblast --freeze copy area)
bind = SHIFT, PRINT, exec, $(grimblast edit area)
bind = $mainMod, Q, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, togglefloating, 
bind = $mainMod, F, fullscreen, 
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/file_selector.sh
bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, V, togglesplit, # dwindle
bind = $mainMod, t, togglegroup
bind = $mainMod, G, submap, group 
bind = $mainMod SHIFT, G, submap, groupOut

submap=group
bind = , L, moveintogroup, r
bind = , H, moveintogroup, l
bind = , K, moveintogroup, u
bind = , J, moveintogroup, d
bind = , ESCAPE, submap, reset
submap=reset

submap=groupOut
bind = , L, moveoutofgroup, r
bind = , H, moveintogroup, l
bind = , K, moveintogroup, u
bind = , J, moveintogroup, d
bind = , ESCAPE, submap, reset
submap=reset


# Move focus 
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d
bind = $mainMod, O, submap, resize

submap=resize
bind = , L, resizeactive, 50 0
bind = , H, resizeactive, -50 0
bind = , K, resizeactive, 0 -50
bind = , J, resizeactive, 0 50
bind = , ESCAPE, submap, reset
submap=reset

bind = $mainMod, D, exec, $(playerctl play-pause)
bind = $mainMod, I, exec, hyprctl dispatch dpms toggle

# Move focus within groups
bind = $mainMod, TAB, changegroupactive, f

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod CONTROL_L, 1, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod CONTROL_L, 2, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod CONTROL_L, 3, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod CONTROL_L, 4, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod CONTROL_L, 5, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Workspace rules
workspace = 1, monitor:HDMI-A-2, default:true
workspace = 2, monitor:HDMI-A-2
workspace = 3, monitor:HDMI-A-2
workspace = 4, monitor:HDMI-A-2
workspace = 5, monitor:HDMI-A-2
workspace = 6, monitor:DP-4, default:true
workspace = 7, monitor:DP-4
workspace = 8, monitor:DP-4
workspace = 9, monitor:DP-4
workspace = 10, monitor:DP-4
workspace = 11, monitor:DP-4
